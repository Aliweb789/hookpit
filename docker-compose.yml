# Start everything:  docker compose up --build
# Dashboard: http://localhost:3000     API / capture URLs: http://localhost:4000
services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "4000:4000"
    volumes:
      - hookpit-data:/data   # keeps the SQLite database between restarts
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        # Public address of the API as seen from the user's browser.
        # Change this if you host Hookpit on a real domain.
        NEXT_PUBLIC_API_URL: ${HOOKPIT_PUBLIC_API_URL:-http://localhost:4000}
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  hookpit-data:
